# SMTP server settings
smtp.host=smtp.example.com
smtp.port=587
smtp.username=your_username
smtp.password=your_password
smtp.starttls=true
smtp.ssl=false

# Mail defaults
mail.from=Sender Name <no-reply@example.com>
mail.subject=Hello from Bulk Mailer

# Optional: rate limit per second (0 for no limit)
rate.limit.per.second=2